name: Deploy lot-scanner Infrastructure (Prod)

# Manual-only on purpose: prod should never deploy as a side effect of a dev push.
on:
  workflow_dispatch:

concurrency:
  group: lot-scanner-infra-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout infra-lot-scanner
      uses: actions/checkout@v4

    - name: Checkout db-lot-scanner migrations
      uses: actions/checkout@v4
      with:
        repository: retrostoremanager/db-lot-scanner
        path: db-lot-scanner

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Create resource group
      run: |
        az group create --name lot-scanner-rg-prod --location eastus --output none 2>/dev/null || true
        echo "Resource group ready."

    - name: Deploy Bicep Template
      uses: azure/arm-deploy@v1
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: lot-scanner-rg-prod
        template: ./main.bicep
        parameters: >-
          ./parameters.prod.json
          anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }}
          jwtAuthenticationSecretKey=${{ secrets.JWT_AUTHENTICATION_SECRET_KEY_PROD }}
          ghActionsServicePrincipalObjectId=${{ secrets.GH_ACTIONS_SP_OBJECT_ID }}
        deploymentName: lot-scanner-infra-prod-${{ github.run_number }}

    - name: Wait for RBAC propagation
      run: sleep 30
      if: success()

    - name: Install PostgreSQL Client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    # lotscanner-prod lives on gamedb's existing shared Postgres server
    # (gamedb-postgres-prod), same consolidation pattern api-gamedb/db-gamedb already use --
    # not a new server. Create the database, then run db-lot-scanner's migrations against
    # it (that repo has no deploy pipeline of its own yet; auto-discovers numbered files
    # like dbproj-mystore's deploy-database.yml does).
    - name: Create lotscanner-prod database
      env:
        PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      run: |
        set -e
        psql "host=gamedb-postgres-prod.postgres.database.azure.com port=5432 dbname=postgres user=sqladmin sslmode=require" \
          -tc "SELECT 1 FROM pg_database WHERE datname = 'lotscanner-prod'" | grep -q 1 \
          || psql "host=gamedb-postgres-prod.postgres.database.azure.com port=5432 dbname=postgres user=sqladmin sslmode=require" \
               -c "CREATE DATABASE \"lotscanner-prod\""
        echo "Database ready."

    - name: Run db-lot-scanner migrations
      env:
        PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      run: |
        set -e
        cd db-lot-scanner/migrations
        CONN="host=gamedb-postgres-prod.postgres.database.azure.com port=5432 dbname=lotscanner-prod user=sqladmin sslmode=require"
        for sql in $(ls [0-9][0-9][0-9]_*.sql 2>/dev/null | grep -v '^000_' | sort); do
          echo "  Running $sql..."
          psql "$CONN" -f "$sql"
        done
        echo "Migrations applied."

    # The lotscanner Postgres connection string needs gamedb's existing server admin
    # password interpolated into a connection string -- same reason infra-gamedb sets
    # GameDbConnectionString via script rather than inline Bicep. AnthropicApiKey/
    # JwtAuthenticationSecretKey are set directly by the Bicep template itself.
    - name: Sync lotscanner connection string to Key Vault and Function App
      env:
        POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      run: |
        set -e
        KV_NAME="lot-scanner-kv-prod"
        PG_HOST="gamedb-postgres-prod.postgres.database.azure.com"
        PG_DB="lotscanner-prod"
        PG_USER="sqladmin"
        CONN_STR="Host=${PG_HOST};Port=5432;Database=${PG_DB};Username=${PG_USER};Password=${POSTGRES_ADMIN_PASSWORD};SSL Mode=Require"

        echo "Updating LotScannerDbConnectionString in Key Vault..."
        az keyvault secret set --vault-name "$KV_NAME" --name "LotScannerDbConnectionString" \
          --value "$CONN_STR" --output none

        echo "Setting ConnectionStrings__lotscanner on Function App (Key Vault refs may not resolve in isolated worker)..."
        az functionapp config appsettings set -g lot-scanner-rg-prod -n lot-scanner-func-prod \
          --settings "ConnectionStrings__lotscanner=$CONN_STR" --output none
        echo "Connection string configured."

    # Not provisioned by main.bicep (added after that template was written) -- fn-lot-scanner
    # calls this to check Lot Scanner add-on entitlement on fn-mystore before every scan.
    - name: Set MyStoreApi base URL
      run: |
        az functionapp config appsettings set -g lot-scanner-rg-prod -n lot-scanner-func-prod \
          --settings "MyStoreApi__BaseUrl=https://mystore-func-prod.azurewebsites.net/api" --output none

    - name: Restart Function App
      run: |
        az functionapp restart --name lot-scanner-func-prod --resource-group lot-scanner-rg-prod --output none
        echo "Function App restarted."

    - name: Deployment Complete
      run: |
        echo "lot-scanner prod infrastructure deployed successfully!"
        echo "Function App: https://lot-scanner-func-prod.azurewebsites.net"
